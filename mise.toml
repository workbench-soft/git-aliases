[tools]
"npm:markdownlint-cli2" = "0.24.0"
"npm:oxfmt" = "0.75.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"

[settings]
# The auto pick of a newer mise installs oxfmt on Windows without its tinypool package.
npm.package_manager = "npm"

[tasks.lint]
description = "Check the repo rules, the shell scripts and the Markdown format"
run = ["markdownlint-cli2", "bash lint.sh", "oxfmt --check"]

[tasks.format]
description = "Format the shell scripts and the Markdown"
run = ["shfmt --write --case-indent bin/* ./*.sh .github/scripts/*.sh hooks/*", "oxfmt"]
