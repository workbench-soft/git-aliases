name: lint

on:
  push:
    branches: [main]
  # PR runs are off: agents run the tests and linter locally before they merge.
  # To run this on PRs again, uncomment the pull_request lines below.
  # pull_request:

# A new push to the same branch or PR stops the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A PR from a fork gets a read-only token.
permissions:
  contents: read

# Without this, steps on Windows run in PowerShell.
defaults:
  run:
    shell: bash

jobs:
  # The repo is public, so GitHub runners cost nothing. Git Bash and Linux both
  # run the aliases, so both get checked.
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install shfmt and shellcheck
        run: |
          if command -v apt-get; then sudo apt-get update -q && sudo apt-get install -yq shfmt shellcheck
          else choco install -y --no-progress shfmt shellcheck; fi
      - run: ./lint.sh
      - run: ./test.sh
