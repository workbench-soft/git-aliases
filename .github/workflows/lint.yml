name: lint

on:
  push:
    branches: [main]
  # The repo is public, so PRs from outside get checked too.
  pull_request:

# A newer push to the same branch or PR cancels this run on GitHub's side.
# The local-ci page cancels the runs GitHub leaves, such as those of a merged PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A PR from a fork gets a read-only token.
permissions:
  contents: read

# Without this, steps on Windows run in PowerShell.
defaults:
  run:
    shell: bash

jobs:
  # The repo is public, so GitHub runners cost nothing. Git Bash and Linux both
  # run the aliases, so both get checked.
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The checks need no push, so the token stays out of .git/config while repo scripts run.
        with:
          persist-credentials: false
      # mise.toml pins shellcheck, shfmt and oxfmt, so CI lints with the local versions.
      - name: Install shfmt, shellcheck and oxfmt
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # Without a pin the action takes the newest mise, and a newer mise once broke the oxfmt install.
          version: 2026.10.25
          # v1 held a Windows oxfmt install without its tinypool package.
          cache_key_prefix: mise-v2
      - run: ./lint.sh
      - run: oxfmt --check
      - run: markdownlint-cli2
      - run: ./test.sh
