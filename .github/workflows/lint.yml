name: lint

on:
  push:
    branches: [main]
  # PR runs are off: agents run the tests and linter locally before they merge.
  # To run this on PRs again, uncomment the pull_request lines below.
  # pull_request:

# A new push to the same branch or PR stops the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Without this, steps on Windows run in PowerShell.
defaults:
  run:
    shell: bash

jobs:
  # A private repo pays for hosted minutes, so the job runs on the Windows PC for free.
  lint:
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v5
      - name: Install shfmt and shellcheck
        run: |
          command -v shfmt || winget.exe install --id mvdan.shfmt --exact --silent --accept-source-agreements --accept-package-agreements
          command -v shellcheck || winget.exe install --id koalaman.shellcheck --exact --silent --accept-source-agreements --accept-package-agreements
      - run: ./lint.sh
      - run: ./test.sh
