name: lint

on:
  push:
  pull_request:

jobs:
  # The repo is private, so this job runs on the Mac for 0 minutes.
  lint:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v5
      - name: Install shfmt and shellcheck
        run: |
          command -v shfmt || brew install shfmt
          command -v shellcheck || brew install shellcheck
      - run: ./lint.sh
      - run: ./test.sh
