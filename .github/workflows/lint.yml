name: lint

on:
  push:
  pull_request:

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  # The repo is private, so this job runs on the Windows PC runner for 0 minutes.
  lint:
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v5
      - name: Install shfmt and shellcheck
        run: |
          command -v shfmt || winget.exe install --id mvdan.shfmt --exact --silent --accept-source-agreements --accept-package-agreements
          command -v shellcheck || winget.exe install --id koalaman.shellcheck --exact --silent --accept-source-agreements --accept-package-agreements
      - run: ./lint.sh
      - run: ./test.sh
