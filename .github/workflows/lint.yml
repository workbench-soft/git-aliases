name: lint

on:
  push:
    branches: [main]
  # The repo is public, so PRs from outside get checked too.
  pull_request:

# A new push to the same branch or PR stops the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A PR from a fork gets a read-only token.
permissions:
  contents: read

# Without this, steps on Windows run in PowerShell.
defaults:
  run:
    shell: bash

jobs:
  # The repo is public, so GitHub runners cost nothing. Git Bash and Linux both
  # run the aliases, so both get checked.
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # mise.toml pins shellcheck and shfmt, so CI lints with the local versions.
      - name: Install shfmt and shellcheck
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: ./lint.sh
      # test.sh expects Git for Windows paths. On Linux it stops early, see TODO.md.
      - run: ./test.sh
        if: runner.os == 'Windows'
