name: Release

# Each push to main whose lint run passes gets a release. The version is the date: 2026.10.30.1, then 2026.10.30.2.

# The release carries notes only, since the repo builds no file to ship.
on:
  push:
    branches: [main]
  # The repo is public, so PRs from outside get checked too.
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

  SHA: ${{ github.sha }}

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.ref == 'refs/heads/main'

    # The repo is public, so a GitHub runner costs 0 minutes and fork code stays off the PC.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          # The release notes and the next version need every earlier tag and commit.
          fetch-depth: 0

      - name: Pick the next version
        id: version
        run: echo "tag=v$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      # A tag pushed with the workflow token doesn't start other workflows.
      - name: Wait for matching checks before publication
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_WORKFLOW: lint.yml
        run: bash .github/scripts/wait-for-checks.sh

      - name: Tag the commit and publish the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          git tag "$TAG" "$SHA"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"
