name: Release

# Each push to main gets a release once its lint run passes. The version is the date: 2026.10.30.1, then 2026.10.30.2.
# Release starts once lint pass on main, so no job holds a runner while it waits.
on:
  workflow_run:
    workflows: [lint]
    types: [completed]
  # A run by hand ships main again, once its lint passed. The local-ci page starts it this way.
  workflow_dispatch:

# One release at a time. A newer run waiting here replaces an older waiting one, and ships its commits too.
concurrency:
  group: release

permissions:
  actions: read
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# Windows runs steps in PowerShell unless told otherwise.
defaults:
  run:
    shell: bash

jobs:
  release:
    # Only lint that passed on a push to main of this repo, or a run by hand on main, start it.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event))
    # The repo is public, so a GitHub runner costs 0 minutes and fork code stays off the PC.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          # The release notes and the next version need every earlier tag and commit.
          fetch-depth: 0

      # A run by hand looks up lint of the commit once and stops unless they passed. It doesn't wait.
      - name: Check that lint passed on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECKS_WORKFLOW: lint.yml
        run: |
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$CHECKS_WORKFLOW/runs?head_sha=$SHA&branch=main&per_page=1" --jq '.workflow_runs[0].conclusion // "missing"')
          if [ "$result" != success ]; then
            echo "::error::lint of $SHA: $result. Run lint on main, and this follows once they pass."
            exit 1
          fi

      - name: Pick the next version
        id: version
        run: echo "tag=v$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

      # gh release create makes the tag with the release, so a cancel leaves no tag without a release.
      # Two releases side by side can pick the same version. The later one then fails, and the next push ships its commits.
      - name: Tag the commit and publish the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$SHA" --notes-file "$RUNNER_TEMP/notes.md" --title "$TAG"
